<script>
    let carrinho = [];
    let subtotal = 0;

    function render() {
        const div = document.getElementById('lista');
        const selBairro = document.getElementById('bairro');
        const taxaEntrega = parseFloat(selBairro.options[selBairro.selectedIndex].dataset.taxa) || 0;
        
        div.innerHTML = "";
        subtotal = 0;
        
        carrinho.forEach((item, index) => {
            subtotal += item.p;
            div.innerHTML += `<div class="item-row">
                <span><b>${index+1}.</b> ${item.n}</span>
                <span>R$ ${item.p.toFixed(2)} <span class="remove-btn" onclick="remover(${index})">X</span></span>
            </div>`;
        });

        const totalGeral = subtotal + taxaEntrega;
        
        if(taxaEntrega > 0) {
            document.getElementById('taxa-entrega-display').style.display = 'block';
            document.getElementById('valor-taxa-txt').innerText = `R$ ${taxaEntrega.toFixed(2)}`;
        } else {
            document.getElementById('taxa-entrega-display').style.display = 'none';
        }

        document.getElementById('total-txt').innerText = `R$ ${totalGeral.toFixed(2)}`;
    }

    function remover(index) {
        carrinho.splice(index, 1);
        render();
    }

    function addPizza() {
        const s1 = document.getElementById('p1').value;
        const s2 = document.getElementById('p2').value;
        const selBorda = document.getElementById('borda');
        const bordaNome = selBorda.value;
        const precoBorda = parseFloat(selBorda.options[selBorda.selectedIndex].dataset.extra);
        
        let nomeFinal = s2 === "" ? `Pizza ${s1}` : `Pizza 1/2 ${s1} | 1/2 ${s2}`;
        nomeFinal += ` (Borda: ${bordaNome})`;
        
        const precoTotalPizza = 39.90 + precoBorda;
        
        carrinho.push({n: nomeFinal, p: precoTotalPizza});
        render();
    }

    function addEsfiha() {
        const sel = document.getElementById('esfiha');
        const nome = sel.value;
        const preco = parseFloat(sel.options[sel.selectedIndex].dataset.preco);
        carrinho.push({n: `Esfiha ${nome}`, p: preco});
        render();
    }

    function addRefri() {
        const sel = document.getElementById('refri');
        const nome = sel.value;
        const preco = parseFloat(sel.options[sel.selectedIndex].dataset.p);
        carrinho.push({n: nome, p: preco});
        render();
    }

    function verTroco() {
        document.getElementById('campo-troco').style.display = (document.getElementById('pgto').value === "Dinheiro") ? "block" : "none";
    }

    function enviar() {
        const nome = document.getElementById('nome').value;
        const bairro = document.getElementById('bairro').value;
        const end = document.getElementById('end').value;
        const obs = document.getElementById('obs').value;
        const pgto = document.getElementById('pgto').value;
        const troco = document.getElementById('troco-val').value;
        
        const selBairro = document.getElementById('bairro');
        const taxaEntrega = parseFloat(selBairro.options[selBairro.selectedIndex].dataset.taxa) || 0;
        const totalFinal = subtotal + taxaEntrega;

        if(!nome || !bairro || !end || carrinho.length === 0) {
            alert("Por favor, preencha nome, bairro, endereço e escolha os produtos!"); return;
        }

        let msg = `*NOVO PEDIDO - PIZZARIA OLIVEIRA* 🍕\n\n`;
        msg += `*Cliente:* ${nome}\n`;
        msg += `*Endereço:* ${end}\n`;
        msg += `*Bairro:* ${bairro}\n`;
        if(obs) msg += `*Obs:* ${obs}\n`;
        
        msg += `\n*ITENS:*\n${carrinho.map(i => "• " + i.n + " (R$ " + i.p.toFixed(2) + ")").join('\n')}\n`;
        
        msg += `\n*Subtotal:* R$ ${subtotal.toFixed(2)}`;
        msg += `\n*Taxa de Entrega:* R$ ${taxaEntrega.toFixed(2)}`;
        msg += `\n*TOTAL FINAL:* R$ ${totalFinal.toFixed(2)}`;
        msg += `\n\n*FORMA DE PAGAMENTO:* ${pgto}`;
        
        if(pgto === "Dinheiro" && troco) msg += ` (Troco para R$ ${troco})`;

        window.open(`https://wa.me/5512991119914?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "COLOQUE_AQUI",
            authDomain: "COLOQUE_AQUI",
            projectId: "COLOQUE_AQUI",
            storageBucket: "COLOQUE_AQUI",
            messagingSenderId: "COLOQUE_AQUI",
            appId: "COLOQUE_AQUI"
        };
        const FCM_VAPID_KEY = "COLOQUE_AQUI";

        async function prepararNotificacoes() {
            const status = document.getElementById("notificacao-status");
            if (!("serviceWorker" in navigator) || !("Notification" in window)) {
                status.textContent = "⚠️ Este navegador não suporta notificações Push.";
                return;
            }
            try {
                const registration = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
                await navigator.serviceWorker.ready;

                if (FIREBASE_CONFIG.apiKey === "COLOQUE_AQUI" || FCM_VAPID_KEY === "COLOQUE_AQUI") {
                    status.textContent = "🔔 Notificações: estrutura instalada. Falta conectar o Firebase.";
                    return;
                }

                if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
                const messaging = firebase.messaging();
                const permission = await Notification.requestPermission();

                if (permission !== "granted") {
                    status.textContent = "🔕 Notificações desativadas neste navegador.";
                    return;
                }

                const token = await messaging.getToken({
                    vapidKey: FCM_VAPID_KEY,
                    serviceWorkerRegistration: registration
                });

                if (token) {
                    localStorage.setItem("pizzaria_oliveira_fcm_token", token);
                    status.textContent = "🔔 Notificações de novos pedidos ativadas!";
                    console.log("FCM token registrado.");
                }
            } catch (erro) {
                console.error("Falha ao preparar notificações:", erro);
                status.textContent = "⚠️ Não foi possível ativar as notificações agora.";
            }
        }

        prepararNotificacoes();
    </script>
